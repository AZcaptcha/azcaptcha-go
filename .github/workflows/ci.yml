name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21", "1.22", "1.23", "1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: gofmt -l . | grep . && exit 1 || true
      - run: go vet ./...
      - run: go test ./...
